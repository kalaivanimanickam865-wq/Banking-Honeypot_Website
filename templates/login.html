{% extends "base.html" %}
{% block title %}Login — SecureTrust Bank{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h4 class="card-title mb-3">Online Banking Login</h4>
        <form method="POST" action="{{ url_for('main.login') }}" autocomplete="off">
          <div class="mb-3">
            <label class="form-label" for="username">Username / Customer ID</label>
            <input class="form-control" type="text" id="username" name="username" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label" for="password">Password</label>
            <input class="form-control" type="password" id="password" name="password" required>
          </div>
          <button class="btn btn-primary w-100" type="submit">Login</button>
        </form>
        <div class="text-center mt-3">
          <a href="{{ url_for('main.forgot_password') }}">Forgot password?</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
