{% extends "base.html" %}
{% block title %}Forgot Password — SecureTrust Bank{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h4 class="card-title mb-3">Reset Your Password</h4>
        <p class="text-muted">Enter your registered email and we'll send you a reset link.</p>
        <form onsubmit="event.preventDefault(); this.querySelector('.reset-msg').classList.remove('d-none');">
          <div class="mb-3">
            <label class="form-label" for="email">Registered Email</label>
            <input class="form-control" type="email" id="email" name="email" required>
          </div>
          <button class="btn btn-primary w-100" type="submit">Send Reset Link</button>
          <div class="alert alert-success mt-3 d-none reset-msg">
            If that email is registered, a reset link has been sent.
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
